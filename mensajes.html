<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comunicados | STESIN</title><link rel="stylesheet" href="css/style.css"><script src="js/firebase-inicio.js"></script><script src="js/aulax.js" defer></script><script src="js/mensajes.js" defer></script><style>.message-hero{padding:28px;border-radius:22px;background:linear-gradient(135deg,#14382f,#dca91b);color:#fff}.message-panel{margin-top:20px;padding:22px;border:1px solid #e6dcc8;border-radius:18px;background:#fffdf8}.message-list{display:grid;gap:12px}.message{padding:16px;border-radius:14px;border-left:4px solid #dca91b;background:#f7f4ed}.message h3,.message p{margin:0 0 6px}.message small{color:#64748b}.message-form{display:grid;gap:10px}.message-form input,.message-form textarea,.message-form select{padding:11px;border:1px solid #d7e1dc;border-radius:10px;font:inherit}@media(max-width:700px){.message-panel{padding:17px}}</style></head><body><aside class="sidebar"><h2>STESIN</h2><a href="index.html">Inicio</a><a href="academico.html">Aula académica</a></aside><main class="main"><header><div><p class="eyebrow">COMUNICACIÓN ACADÉMICA</p><h1>Comunicados</h1><p>Mensajes oficiales dirigidos a la comunidad o a un ciclo.</p></div></header><section class="message-hero"><h2>Información en un solo lugar</h2><p>Los docentes y la administración pueden publicar comunicados para sus estudiantes.</p></section><section class="message-panel" id="panelRedaccion" hidden><h2>Nuevo comunicado</h2><form id="formMensaje" class="message-form"><input name="titulo" required placeholder="Título"><textarea name="mensaje" required placeholder="Escribe el comunicado"></textarea><select name="audiencia"><option value="estudiantes">Estudiantes</option><option value="todos">Toda la comunidad</option></select><select name="ciclo"><option value="">Todos los ciclos</option><option>Ciclo I</option><option>Ciclo II</option><option>Ciclo III</option><option>Ciclo IV<
