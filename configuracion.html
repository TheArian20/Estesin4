<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Configuración | STESIN</title>

<link rel="stylesheet" href="css/style.css">
<script src="js/aulax.js" defer></script>

<style>

.profile-card{

background:white;

padding:30px;

border-radius:20px;

box-shadow:0 10px 20px rgba(0,0,0,.08);

max-width:900px;

margin:auto;

}

.profile-header{

text-align:center;

margin-bottom:30px;

}

.profile-header img{

width:130px;

height:130px;

border-radius:50%;

border:5px solid #2563eb;

margin-bottom:15px;

}

.form-group{

margin-bottom:20px;

}

.form-group label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

.form-group input{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:10px;

font-size:15px;

}

.options{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

margin-top:30px;

}

.option{

background:#f5f7fb;

padding:20px;

border-radius:15px;

}

.save{

margin-top:30px;

background:#2563eb;

color:white;

padding:15px 30px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

}

.save:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<div class="sidebar">

<h2>STESIN</h2>

<a href="index.html">🏠 Inicio</a>

<a href="cursos.html">📚 Ciclos</a>


<a href="biblioteca.html">📚 Biblioteca</a>

<a href="calendario.html">📅 Calendario</a>

<a href="configuracion.html">⚙ Configuración</a>

</div>

<div class="main">

<header>

<div>

<h1>⚙ Configuración</h1>

<p>Administra tu cuenta.</p>

</div>

<div class="profile">

<img id="fotoHeader"
src="https://i.pravatar.cc/150?img=12">

<p id="usuarioHeader"></p>

</div>

</header>

<div class="profile-card">

<div class="profile-header">

<img id="fotoPerfil" src="https://i.pravatar.cc/200?img=12">

<br><br>

<input
type="file"
id="subirFoto"
accept="image/*">

<h2 id="nombrePerfil"></h2>

<p id="carreraPerfil"></p>

<p id="fechaPerfil"></p>

</div>

<div class="form-group">

<label>Nombre Completo</label>

<input
type="text"
id="nombreInput">

</div>

<div class="form-group">

<label>Correo Electrónico</label>

<input
type="email"
id="correoInput">

</div>

<div class="form-group">

<label>Carrera</label>

<input
type="text"
id="carreraInput">

</div>

<div class="options">

<div class="option">

<h3>🌙 Modo Oscuro</h3>

<p>Estado: Próximamente</p>

</div>

<div class="option">

<h3>🔔 Notificaciones</h3>

<p>Activadas</p>

</div>

<div class="option">

<h3>🌐 Idioma</h3>

<p>Español</p>

</div>

<div class="option">

<h3>🎓 Certificados</h3>

<p>3 obtenidos</p>

</div>

</div>

<button class="save" onclick="guardar()">

💾 Guardar Cambios

</button>

<p id="estadoGuardado" aria-live="polite"></p>

</div>

</div>

<script>

//=======================
// CARGAR DATOS
//=======================

document.getElementById("nombrePerfil").textContent=

localStorage.getItem("usuario") || "Invitado";

document.getElementById("carreraPerfil").textContent=

localStorage.getItem("carreraUsuario") || "Sin carrera";

document.getElementById("fechaPerfil").textContent=

"Registrado: " +

(localStorage.getItem("fechaRegistro") || "-");

document.getElementById("nombreInput").value=

localStorage.getItem("usuario") || "";

document.getElementById("correoInput").value=

localStorage.getItem("correoUsuario") || "";

document.getElementById("carreraInput").value=

localStorage.getItem("carreraUsuario") || "";

//=======================
// CARGAR FOTO
//=======================

const fotoGuardada=

localStorage.getItem("fotoPerfil");

if(fotoGuardada){

document.getElementById("fotoPerfil").src=fotoGuardada;

}

//=======================
// GUARDAR CAMBIOS
//=======================

function guardar(){

const nombre=

document.getElementById("nombreInput").value.trim();

const correo=

document.getElementById("correoInput").value.trim();

const carrera=

document.getElementById("carreraInput").value.trim();

if(!nombre || !correo || !carrera || !document.getElementById("correoInput").checkValidity()){

document.getElementById("estadoGuardado").style.color="crimson";
document.getElementById("estadoGuardado").textContent="Completa los campos con información válida.";
return;

}

localStorage.setItem("usuario",nombre);

localStorage.setItem("correoUsuario",correo);

localStorage.setItem("carreraUsuario",carrera);

document.getElementById("nombrePerfil").textContent=nombre;

document.getElementById("carreraPerfil").textContent=carrera;

document.querySelectorAll("#usuarioHeader").forEach(function(elemento){
elemento.textContent=nombre;
});

document.getElementById("estadoGuardado").style.color="green";
document.getElementById("estadoGuardado").textContent="Cambios guardados correctamente.";

}

//==================================
// FOTO DE PERFIL
//==================================

const inputFoto=document.getElementById("subirFoto");

inputFoto.addEventListener("change",function(){

const archivo=this.files[0];

if(!archivo) return;

const lector=new FileReader();

lector.onload=function(e){

const imagen=e.target.result;

localStorage.setItem("fotoPerfil",imagen);

document.getElementById("fotoPerfil").src=imagen;

document.querySelectorAll("#fotoHeader").forEach(function(elemento){
elemento.src=imagen;
});

}

lector.readAsDataURL(archivo);

});
</script>

</body>

</html>
