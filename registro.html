<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registro | STESIN</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/aulax.js" defer></script></head>
<body class="login-body"><main class="login-box"><h1>Crear cuenta</h1><p>Regístrate en STESIN</p><input type="text" id="nombre" placeholder="Nombre completo" autocomplete="name" required><input type="text" id="usuario" placeholder="Usuario (ejemplo: maria.aguirre)" autocomplete="username" required><input type="text" id="carrera" placeholder="Carrera" required><input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" minlength="6" required><button type="button" id="btnRegistro">Registrarse</button><p><a href="login.html">Ya tengo una cuenta</a></p><p id="mensaje" aria-live="polite"></p></main>
<script>const mensaje=document.getElementById('mensaje');function normalizarUsuario(valor){return valor.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9.]/g,'');}async function registrar(){const nombre=document.getElementById('nombre').value.trim(),usuario=normalizarUsuario(document.getElementById('usuario').value),carrera=document.getElementById('carrera').value.trim(),password=document.getElementById('password').value;if(!nombre||usuario.length<3||!carrera||password.length<6){mensaje.textContent='Completa los campos. El usuario debe tener 3 caracteres y la contraseña 6 o más.';return;}const {data,error}=await STESIN_SUPABASE.auth.signUp({email:`${usuario}@stestin.local`,password,options:{data:{nombre,carrera,usuario}}});if(error){mensaje.textContent=error.message.includes('already')?'Ese usuario ya está ocupado.':'No se pudo crear la cuenta: '+error.message;return;}mensaje.textContent=data.session?'Cuenta creada. Ya puedes ingresar.':'Cuenta creada. Pide al administrador que active la confirmación automática.';}document.getElementById('btnRegistro').addEventListener('click',registrar);document.addEventListener('keydown',e=>{if(e.key==='Enter')registrar()});</script></body></html>
