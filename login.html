<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso institucional | STESIN</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/aulax.js" defer></script>
</head>
<body class="login-body">
  <main class="login-box">
    <h1>STESIN</h1>
    <p>Acceso para docentes, rector y administracion</p>
    <input type="text" id="usuario" placeholder="Correo o usuario institucional" autocomplete="username">
    <input type="password" id="password" placeholder="Contrasena" autocomplete="current-password">
    <button type="button" id="btnIngresar">Ingresar</button>
    <button type="button" id="btnEstudiante">Ingresar como estudiante</button>
    <p>Los estudiantes pueden consultar la plataforma sin usuario ni contrasena.</p>
    <p id="mensaje" aria-live="polite"></p>
  </main>
  <script>
    const mensaje = document.getElementById('mensaje');
    function usuarioInterno(valor) {
      const limpio = valor.trim().toLowerCase();
      const clave = limpio.replace(/\s+/g, '');
      if (['arianch', 'arianchujutalli', 'arianalejandro'].includes(clave)) return 'arianchujutalli18@gmail.com';
      return limpio.includes('@') ? limpio : `${limpio}@stestin-interno.com`;
    }
    async function login() {
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      if (!usuario || !password) { mensaje.textContent = 'Ingresa tu correo institucional y contrasena.'; return; }
      const { data, error } = await STESIN_SUPABASE.auth.signInWithPassword({ email: usuarioInterno(usuario), password });
      if (error) { mensaje.textContent = `No fue posible ingresar: ${error.message}`; return; }
      const { data: perfil, error: errorPerfil } = await STESIN_SUPABASE.from('perfiles').select('activo,rol').eq('id', data.user.id).single();
      if (errorPerfil || !perfil?.activo) {
        await STESIN_SUPABASE.auth.signOut();
        mensaje.textContent = 'La cuenta no esta activa. Contacta a administracion.';
        return;
      }
      if (perfil.rol === 'estudiante') {
        await STESIN_SUPABASE.auth.signOut();
        window.location.replace('index.html');
        return;
      }
      window.location.replace('index.html');
    }
    document.getElementById('btnIngresar').addEventListener('click', login);
    document.getElementById('btnEstudiante').addEventListener('click', () => window.location.replace('index.html'));
    document.addEventListener('keydown', (evento) => { if (evento.key === 'Enter') login(); });
    if (new URLSearchParams(location.search).get('estado') === 'inactivo') mensaje.textContent = 'La cuenta esta desactivada.';
  </script>
</body>
</html>
