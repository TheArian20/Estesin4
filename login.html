<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrativo | STESIN</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/aulax.js" defer></script>
</head>
<body class="login-body">
  <main class="login-box">
    <h1>STESIN</h1>
    <p>Acceso administrativo</p>
    <input type="email" id="usuario" placeholder="Correo del administrador" autocomplete="username">
    <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
    <button type="button" id="btnIngresar">Ingresar al panel administrativo</button>
    <button type="button" id="btnEstudiante">Ingresar como estudiante</button>
    <p>Los estudiantes pueden consultar la plataforma sin usuario ni contrasena.</p>
    <p id="mensaje" aria-live="polite"></p>
  </main>
  <script>
    const mensaje = document.getElementById('mensaje');
    async function login() {
      const usuario = document.getElementById('usuario').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!usuario || !password) { mensaje.textContent = 'Ingresa el correo y la contrasena del administrador.'; return; }
      mensaje.textContent = 'Comprobando acceso...';
      try {
        const credencial = await window.STESIN_AUTH.signInWithEmailAndPassword(usuario, password);
        if (!window.STESIN_ES_ADMIN(credencial.user)) {
          await window.STESIN_AUTH.signOut();
          mensaje.textContent = 'Esta cuenta no tiene permiso de administrador.';
          return;
        }
        localStorage.setItem('login', 'true');
        localStorage.setItem('usuario', credencial.user.email || 'Administrador');
        localStorage.setItem('rolUsuario', 'admin');
        localStorage.setItem('usuarioId', credencial.user.uid);
        window.location.replace('index.html');
      } catch (error) {
        const mensajes = {
          'auth/invalid-credential': 'Correo o contrasena incorrectos.',
          'auth/invalid-email': 'El correo no es valido.',
          'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.'
        };
        mensaje.textContent = mensajes[error.code] || 'No fue posible ingresar.';
      }
    }
    document.getElementById('btnIngresar').addEventListener('click', login);
    document.getElementById('btnEstudiante').addEventListener('click', () => window.location.replace('index.html'));
    document.addEventListener('keydown', (evento) => { if (evento.key === 'Enter') login(); });
    if (new URLSearchParams(location.search).get('estado') === 'inactivo') mensaje.textContent = 'La cuenta esta desactivada.';
  </script>
</body>
</html>
