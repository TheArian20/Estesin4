<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso administrativo | STESIN</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/aulax.js" defer></script>
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-brand" aria-label="STESIN">
      <div>
        <img src="assets/stesin-logo.svg" alt="Escudo de STESIN">
        <h1>STESIN</h1>
        <p>Formación, servicio y gestión académica en un solo espacio.</p>
      </div>
      <small>Seminario Teológico de las Iglesias del Nombre</small>
    </section>
    <section class="login-box">
      <h2>Acceso administrativo</h2>
      <p class="login-intro">Ingresa con la cuenta autorizada para gestionar la plataforma.</p>
      <form class="login-form" id="formLogin">
        <label class="login-field" for="usuario">Correo electrónico
          <input type="email" id="usuario" placeholder="administracion@ejemplo.com" autocomplete="username" required>
        </label>
        <label class="login-field" for="password">Contraseña
          <input type="password" id="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
        </label>
        <button type="submit" id="btnIngresar">Ingresar al panel</button>
        <div class="login-divider"><span>o continúa como visitante</span></div>
        <button type="button" id="btnEstudiante">Entrar como estudiante</button>
        <p class="student-note">El contenido público puede consultarse sin usuario ni contraseña.</p>
        <p id="mensaje" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script>
    const mensaje = document.getElementById('mensaje');
    async function login() {
      const usuario = document.getElementById('usuario').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      if (!usuario || !password) { mensaje.textContent = 'Ingresa el correo y la contrasena del administrador.'; return; }
      mensaje.textContent = 'Comprobando acceso...';
      try {
        const credencial = await window.STESIN_AUTH.signInWithEmailAndPassword(usuario, password);
        if (!window.STESIN_ES_ADMIN(credencial.user)) {
          await window.STESIN_AUTH.signOut();
          mensaje.textContent = 'Esta cuenta no tiene permiso de administrador.';
          return;
        }
        localStorage.setItem('login', 'true');
        localStorage.setItem('usuario', credencial.user.email || 'Administrador');
        localStorage.setItem('rolUsuario', 'admin');
        localStorage.setItem('usuarioId', credencial.user.uid);
        window.location.replace('index.html');
      } catch (error) {
        const mensajes = {
          'auth/invalid-credential': 'Correo o contrasena incorrectos.',
          'auth/invalid-email': 'El correo no es valido.',
          'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.'
        };
        mensaje.textContent = mensajes[error.code] || 'No fue posible ingresar.';
      }
    }
    document.getElementById('formLogin').addEventListener('submit', (evento) => { evento.preventDefault(); login(); });
    document.getElementById('btnEstudiante').addEventListener('click', () => window.location.replace('index.html'));
    if (new URLSearchParams(location.search).get('estado') === 'inactivo') mensaje.textContent = 'La cuenta esta desactivada.';
  </script>
</body>
</html>
