<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ingresar | STESIN</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/aulax.js" defer></script></head>
<body class="login-body"><main class="login-box"><h1>STESIN</h1><p>Plataforma Virtual</p><input type="email" id="correo" placeholder="Correo electrónico" autocomplete="email" required><input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required><button type="button" id="btnIngresar">Ingresar</button><p>¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p><p id="mensaje" aria-live="polite"></p></main>
<script>
const mensaje=document.getElementById('mensaje');
async function login(){const correo=document.getElementById('correo').value.trim(),password=document.getElementById('password').value;if(!correo||!password){mensaje.textContent='Completa tu correo y contraseña.';return;}const {data,error}=await STESIN_SUPABASE.auth.signInWithPassword({email:correo,password});if(error){mensaje.textContent='Correo o contraseña incorrectos.';return;}const {data:perfil}=await STESIN_SUPABASE.from('perfiles').select('activo').eq('id',data.user.id).single();if(!perfil?.activo){await STESIN_SUPABASE.auth.signOut();mensaje.textContent='Tu cuenta está desactivada. Comunícate con administración.';return;}window.location.replace('index.html');}
document.getElementById('btnIngresar').addEventListener('click',login);document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(new URLSearchParams(location.search).get('estado')==='inactivo')mensaje.textContent='Tu sesión fue cerrada porque tu cuenta está desactivada.';
</script></body></html>
