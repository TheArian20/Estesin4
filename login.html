<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar | STESIN</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/aulax.js" defer></script>
</head>
<body class="login-body">
<main class="login-box">
<h1>STESIN</h1><p>Plataforma Virtual</p>
<input type="text" id="usuario" placeholder="Usuario" autocomplete="username" required>
<input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
<button type="button" id="btnIngresar">Ingresar</button>
<p>Las cuentas son creadas por la administración de STESIN. Si necesitas acceso, comunícate con tu administrador.</p><p id="mensaje" aria-live="polite"></p>
</main>
<script>
const mensaje=document.getElementById('mensaje');
function usuarioInterno(valor){const limpio=valor.trim().toLowerCase();const clave=limpio.replace(/\s+/g,'');if(['arianch','arianchujutalli','arianalejandro'].includes(clave))return 'arianchujutalli18@gmail.com';return limpio.includes('@')?limpio:`${limpio}@stestin-interno.com`;}
async function login(){const usuario=document.getElementById('usuario').value.trim(),password=document.getElementById('password').value;if(!usuario||!password){mensaje.textContent='Completa tu usuario y contraseña.';return;}const {data,error}=await STESIN_SUPABASE.auth.signInWithPassword({email:usuarioInterno(usuario),password});if(error){mensaje.textContent='Usuario o contraseña incorrectos.';return;}const {data:perfil}=await STESIN_SUPABASE.from('perfiles').select('activo').eq('id',data.user.id).single();if(!perfil?.activo){await STESIN_SUPABASE.auth.signOut();mensaje.textContent='Tu cuenta está desactivada. Comunícate con administración.';return;}window.location.replace('index.html');}
document.getElementById('btnIngresar').addEventListener('click',login);document.addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(new URLSearchParams(location.search).get('estado')==='inactivo')mensaje.textContent='Tu sesión fue cerrada porque tu cuenta está desactivada.';
</script>
</body>
</html>
