<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Registro | STESIN</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/aulax.js" defer></script></head>
<body class="login-body"><main class="login-box"><h1>Crear cuenta</h1><p>Regístrate en STESIN</p><input type="text" id="nombre" placeholder="Nombre completo" autocomplete="name" required><input type="email" id="correo" placeholder="Correo electrónico" autocomplete="email" required><input type="text" id="carrera" placeholder="Carrera" required><input type="password" id="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="new-password" minlength="6" required><button type="button" id="btnRegistro">Registrarse</button><p><a href="login.html">Ya tengo una cuenta</a></p><p id="mensaje" aria-live="polite"></p></main>
<script>
const mensaje=document.getElementById('mensaje');
async function registrar(){const nombre=document.getElementById('nombre').value.trim(),correo=document.getElementById('correo').value.trim(),carrera=document.getElementById('carrera').value.trim(),password=document.getElementById('password').value;if(!nombre||!correo||!carrera||password.length<6){mensaje.textContent='Completa todos los campos. La contraseña debe tener 6 caracteres o más.';return;}const {data,error}=await STESIN_SUPABASE.auth.signUp({email:correo,password,options:{data:{nombre,carrera},emailRedirectTo:new URL('login.html',location.href).href}});if(error){mensaje.textContent=error.message;return;}mensaje.textContent=data.session?'Cuenta creada. Ya puedes ingresar.':'Cuenta creada. Revisa tu correo para confirmarla antes de ingresar.';}
document.getElementById('btnRegistro').addEventListener('click',registrar);document.addEventListener('keydown',e=>{if(e.key==='Enter')registrar()});
</script></body></html>
